<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAL.py 題目列表</title>
  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/cal/shared/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/cal/shared/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/cal/shared/favicons/favicon-16x16.png">
  <link rel="manifest" href="/cal/shared/favicons/site.webmanifest">
  <link rel="mask-icon" href="/cal/shared/favicons/safari-pinned-tab.svg" color="#3b82f6">
  <link rel="shortcut icon" href="/cal/shared/favicons/favicon.ico">
  <meta name="msapplication-TileColor" content="#0f172a">
  <meta name="theme-color" content="#0f172a">
  <style>
    :root{ --bg:#111318; --panel:#171a21; --panel-strong:#1f232c; --border:#303641; --text:#f3f4f6; --muted:#9ca3af; --accent:#38bdf8; --ok:#22c55e; }
    *{box-sizing:border-box} html,body{height:100%;margin:0}
    body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial}
    header{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:#161a22;position:sticky;top:0}
    .brand{font-weight:750}
    .spacer{flex:1}
    .capsule{border:1px solid var(--border);background:#20252f;color:var(--muted);padding:6px 12px;border-radius:8px;text-decoration:none}
    .capsule:hover{border-color:var(--accent);color:#fff}
    main{max-width:1000px;margin:24px auto;padding:0 16px}
    h2{font-size:22px;line-height:1.25;margin:0 0 18px}
    .grid{display:grid;grid-template-columns:92px 1fr 90px;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel)}
    .row{display:contents}
    .cell{padding:12px 14px;border-bottom:1px solid rgba(31,42,68,.6)}
    .head{background:var(--panel-strong);color:#cbd5e1;font-size:12px;text-transform:uppercase}
    .row:hover .cell{background:rgba(56,189,248,.06)}
    a{color:#7dd3fc;text-decoration:none}
    a:hover{text-decoration:underline}
    .pass{color:var(--ok);font-weight:600}
    @media (max-width:640px){
      header{gap:8px;padding:10px}
      .grid{grid-template-columns:76px 1fr 70px}
      .cell{padding:10px 9px}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">CAL.py</div>
    <button class="capsule">題目列表</button>
    <div class="spacer"></div>
    <a class="capsule" href="/cal/leaderboard/">排行榜</a>
    <a class="capsule" href="/users/login/?next=/cal/topiclist/">登出</a>
  </header>
  <main>
    <h2>本週共有 <span id="total">0</span> 題，你已通過 <span id="passed">0</span> 題</h2>
    <div class="grid" id="grid">
      <div class="cell head">Number</div>
      <div class="cell head">Instruction</div>
      <div class="cell head">Pass</div>
      <!-- rows will be injected here -->
    </div>
  </main>
  <script>
    const topics = [
      {id:'520001', title:'程式導論與 Hello World'},
      {id:'520002', title:'變數宣告與資料型態'},
      {id:'520003', title:'語法錯誤與除錯（Syntax & Debug）'},
      {id:'520004', title:'執行時錯誤（Runtime Error）'},
      {id:'520005', title:'邏輯錯誤（Wrong Answer）'},
      {id:'520006', title:'輸入讀取與型態轉換'},
      {id:'520007', title:'條件判斷 if / elif / else'},
      {id:'520008', title:'迴圈 for 與 range()'},
    ];
    const grid = document.getElementById('grid');
    const isPassed = (id)=>{ try{ return !!localStorage.getItem('pass-'+id); }catch{ return false; } };
    let passed=0;
    // 依序解鎖：第一題永遠開放，其餘需上一題通過
    const rows = topics.map((t, i)=>{
      const r = document.createElement('div'); r.className='row';
      const pass = isPassed(t.id);
      const canClick = i===0 || isPassed(topics[i-1].id);
      if(pass) passed++;
      const titleCell = canClick
        ? `<a href="/cal/topic/?id=${t.id}">${t.title}</a>`
        : `<span style="opacity:.5" title="請先通過上一題">${t.title}</span>`;
      r.innerHTML = `
        <div class="cell">第${i+1}題</div>
        <div class="cell">${titleCell}</div>
        <div class="cell">${pass?'<span class="pass">YES</span>':'—'}</div>
      `;
      return r;
    });
    rows.forEach(r=>grid.appendChild(r));
    document.getElementById('total').textContent = topics.length;
    document.getElementById('passed').textContent = passed;
  </script>
</body>
</html>
